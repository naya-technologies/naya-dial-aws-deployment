AWSTemplateFormatVersion: '2010-09-09'
Description: 'DIAL VPC with public/private subnets, security groups, and VPC endpoints'

Parameters:
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Network allowed to reach the load balancer on HTTPS

  AllowedCidr2:
    Type: String
    Default: ''
    Description: Additional allowed network (leave empty if unused)

  AllowedCidr3:
    Type: String
    Default: ''
    Description: Additional allowed network (leave empty if unused)

  AllowedCidr4:
    Type: String
    Default: ''
    Description: Additional allowed network (leave empty if unused)

  AllowedCidr5:
    Type: String
    Default: ''
    Description: Additional allowed network (leave empty if unused)

  VPCCidr:
    Type: String
    Default: '10.0.0.0/16'

  PublicSubnet1Cidr:
    Type: String

  PublicSubnet2Cidr:
    Type: String

  PrivateSubnet1Cidr:
    Type: String

  PrivateSubnet2Cidr:
    Type: String

Conditions:
  UseAllowedCidr2: !Not [!Equals [!Ref AllowedCidr2, '']]
  UseAllowedCidr3: !Not [!Equals [!Ref AllowedCidr3, '']]
  UseAllowedCidr4: !Not [!Equals [!Ref AllowedCidr4, '']]
  UseAllowedCidr5: !Not [!Equals [!Ref AllowedCidr5, '']]

Resources:
  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet-1'
        - Key: kubernetes.io/role/elb
          Value: '1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet-2'
        - Key: kubernetes.io/role/elb
          Value: '1'

  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-subnet-1'
        - Key: kubernetes.io/role/internal-elb
          Value: '1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-subnet-2'
        - Key: kubernetes.io/role/internal-elb
          Value: '1'

  # Public Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: AttachGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'

  # Private Route Table
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'

  PrivateRoute:
    Type: AWS::EC2::Route
    DependsOn: NatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Security Groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb-sg'

  AlbIngress1Https:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr
      Description: HTTPS from an allowed network

  AlbIngress1Http:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr
      Description: HTTP, only used for the redirect to HTTPS

  AlbIngress2Https:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr2
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr2
      Description: HTTPS from an allowed network

  AlbIngress2Http:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr2
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr2
      Description: HTTP, only used for the redirect to HTTPS

  AlbIngress3Https:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr3
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr3
      Description: HTTPS from an allowed network

  AlbIngress3Http:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr3
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr3
      Description: HTTP, only used for the redirect to HTTPS

  AlbIngress4Https:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr4
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr4
      Description: HTTPS from an allowed network

  AlbIngress4Http:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr4
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr4
      Description: HTTP, only used for the redirect to HTTPS

  AlbIngress5Https:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr5
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr5
      Description: HTTPS from an allowed network

  AlbIngress5Http:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr5
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr5
      Description: HTTP, only used for the redirect to HTTPS

  EKSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EKS cluster and nodes
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-eks-sg'

  # Self-referencing rule for node-to-node communication
  EKSSecurityGroupIngressSelfRef:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EKSSecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId: !Ref EKSSecurityGroup

  # Allow communication from ALB to EKS nodes (for ingress)
  EKSSecurityGroupIngressFromALB:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: ALBSecurityGroup
    Properties:
      GroupId: !Ref EKSSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref ALBSecurityGroup

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rds-sg'

  RDSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EKSSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ElastiCache Redis
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-redis-sg'

  RedisSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RedisSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref EKSSecurityGroup

  # Additional ingress rule for EKS cluster security group (created by EKS)
  # This will be updated after EKS cluster is created via a separate update
  # For now, we keep the EKSSecurityGroup rule above for backward compatibility

  VPCESecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC Endpoints
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpce-sg'

  VPCESecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VPCESecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      # The whole VPC, not a security group: EKS attaches its own cluster security group to the worker
      # nodes, and that group does not exist yet when the nodes boot. They must reach the EC2 API
      # through the endpoint during start-up, or they never join the cluster.
      CidrIp: !Ref VPCCidr

  # ALB to EKS egress rule
  ALBSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: -1
      DestinationSecurityGroupId: !Ref EKSSecurityGroup

  # VPC Endpoints (Interface)

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPCId'

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2

  ALBSecurityGroupId:
    Description: ALB Security Group ID
    Value: !Ref ALBSecurityGroup

  EKSSecurityGroupId:
    Description: EKS Security Group ID
    Value: !Ref EKSSecurityGroup

  PrivateRouteTableId:
    Description: Private Route Table ID (for EKS S3 endpoint)
    Value: !Ref PrivateRouteTable

  RDSSecurityGroupId:
    Description: RDS Security Group ID
    Value: !Ref RDSSecurityGroup

  RedisSecurityGroupId:
    Description: Redis Security Group ID
    Value: !Ref RedisSecurityGroup

  VPCESecurityGroupId:
    Description: VPC Endpoint Security Group ID
    Value: !Ref VPCESecurityGroup
