AWSTemplateFormatVersion: '2010-09-09'
Description: 'DIAL security groups inside an existing (or shared) VPC. Creates no VPC, subnets, routes, NAT or endpoints.'

Parameters:
  VPCId:
    Type: String
    Description: The existing VPC
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Network allowed to reach the load balancer on HTTPS

  AllowedCidr2:
    Type: String
    Default: ''
    Description: Additional allowed network (leave empty if unused)

  AllowedCidr3:
    Type: String
    Default: ''
    Description: Additional allowed network (leave empty if unused)

  AllowedCidr4:
    Type: String
    Default: ''
    Description: Additional allowed network (leave empty if unused)

  AllowedCidr5:
    Type: String
    Default: ''
    Description: Additional allowed network (leave empty if unused)

Conditions:
  UseAllowedCidr2: !Not [!Equals [!Ref AllowedCidr2, '']]
  UseAllowedCidr3: !Not [!Equals [!Ref AllowedCidr3, '']]
  UseAllowedCidr4: !Not [!Equals [!Ref AllowedCidr4, '']]
  UseAllowedCidr5: !Not [!Equals [!Ref AllowedCidr5, '']]

Resources:
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VPCId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb-sg'

  AlbIngress1Https:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr
      Description: HTTPS from an allowed network

  AlbIngress1Http:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr
      Description: HTTP, only used for the redirect to HTTPS

  AlbIngress2Https:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr2
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr2
      Description: HTTPS from an allowed network

  AlbIngress2Http:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr2
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr2
      Description: HTTP, only used for the redirect to HTTPS

  AlbIngress3Https:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr3
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr3
      Description: HTTPS from an allowed network

  AlbIngress3Http:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr3
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr3
      Description: HTTP, only used for the redirect to HTTPS

  AlbIngress4Https:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr4
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr4
      Description: HTTPS from an allowed network

  AlbIngress4Http:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr4
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr4
      Description: HTTP, only used for the redirect to HTTPS

  AlbIngress5Https:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr5
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref AllowedCidr5
      Description: HTTPS from an allowed network

  AlbIngress5Http:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseAllowedCidr5
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedCidr5
      Description: HTTP, only used for the redirect to HTTPS

  EKSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EKS cluster and nodes
      VpcId: !Ref VPCId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-eks-sg'

  EKSSecurityGroupIngressSelfRef:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EKSSecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId: !Ref EKSSecurityGroup

  EKSSecurityGroupIngressFromALB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EKSSecurityGroup
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref ALBSecurityGroup

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId: !Ref VPCId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rds-sg'

  RDSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EKSSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ElastiCache Redis
      VpcId: !Ref VPCId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-redis-sg'

  RedisSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RedisSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref EKSSecurityGroup

  VPCESecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC Endpoints
      VpcId: !Ref VPCId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpce-sg'

  VPCESecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VPCESecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EKSSecurityGroup

  ALBSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: -1
      DestinationSecurityGroupId: !Ref EKSSecurityGroup

Outputs:
  ALBSecurityGroupId:
    Value: !Ref ALBSecurityGroup
  EKSSecurityGroupId:
    Value: !Ref EKSSecurityGroup
  RDSSecurityGroupId:
    Value: !Ref RDSSecurityGroup
  RedisSecurityGroupId:
    Value: !Ref RedisSecurityGroup
  VPCESecurityGroupId:
    Value: !Ref VPCESecurityGroup
