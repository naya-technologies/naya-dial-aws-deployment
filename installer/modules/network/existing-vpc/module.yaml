slot: network
providers: [existing-vpc, shared-vpc]      # a VPC shared through AWS RAM behaves the same way
description: Uses a VPC and subnets that already exist. Creates only the security groups DIAL needs.
requires: []
provides:
  - VPCId
  - PublicSubnet1Id
  - PublicSubnet2Id
  - PrivateSubnet1Id
  - PrivateSubnet2Id
  - PrivateRouteTableId
  - ALBSecurityGroupId
  - EKSSecurityGroupId
  - RDSSecurityGroupId
  - RedisSecurityGroupId
  - VPCESecurityGroupId
  - AlbSubnetIds
