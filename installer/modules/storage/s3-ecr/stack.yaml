AWSTemplateFormatVersion: '2010-09-09'
Description: 'DIAL storage resources'

Resources:
  DIALBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'dial-storage-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-storage-bucket'

  CodeAppRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: aidial/code-app
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-code-app-repository'

  DeploymentManagerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: aidial/deployment-manager
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-deployment-manager-repository'

  DIALBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DIALBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DIALBucket.Arn
              - !Sub '${DIALBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  S3BucketName:
    Description: S3 Bucket Name for DIAL storage
    Value: !Ref DIALBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  S3BucketArn:
    Description: S3 Bucket ARN
    Value: !GetAtt DIALBucket.Arn

  CodeAppRepositoryName:
    Description: ECR repository name for generated DIAL code app images
    Value: !Ref CodeAppRepository

  CodeAppRepositoryUri:
    Description: ECR repository URI for generated DIAL code app images
    Value: !GetAtt CodeAppRepository.RepositoryUri

  DeploymentManagerRepositoryArn:
    Description: ECR repository ARN for the Deployment Manager and generated deployment images
    Value: !GetAtt DeploymentManagerRepository.Arn

  DeploymentManagerRepositoryUri:
    Description: ECR repository URI for the Deployment Manager and generated deployment images
    Value: !GetAtt DeploymentManagerRepository.RepositoryUri
