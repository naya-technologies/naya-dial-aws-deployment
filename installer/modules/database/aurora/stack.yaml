AWSTemplateFormatVersion: '2010-09-09'
Description: 'DIAL RDS Aurora PostgreSQL Serverless v2 Database'

Parameters:
  DeploymentName:
    Type: String
    Description: Installation name; keeps resource names unique per installation

  PrivateSubnet1Id:
    Type: String

  PrivateSubnet2Id:
    Type: String

  RDSSecurityGroupId:
    Type: String

  EKSClusterSecurityGroupId:
    Type: String

  DBMasterUsername:
    Type: String
    Default: postgres

  DBSecretArn:
    Type: String
    Description: ARN of the customer's Secrets Manager secret (key db_master_password holds the master password)

  DBName:
    Type: String
    Default: dialadmin

  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Days automated backups are kept

  DeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Refuse to delete the cluster while enabled

  EngineVersion:
    Type: String
    Description: Aurora PostgreSQL engine version (must be available for new clusters in this region)

  MinCapacity:
    Type: Number
    Default: 1
    Description: Minimum ACU (Aurora Capacity Units)

  MaxCapacity:
    Type: Number
    Default: 4
    Description: Maximum ACU (Aurora Capacity Units)

Resources:
  # DB Subnet Group
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${AWS::StackName}-db-subnet-group'
      DBSubnetGroupDescription: Subnet group for DIAL RDS Aurora
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-db-subnet-group'

  # Aurora DB Cluster
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub '${DeploymentName}-db'
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: !Ref EngineVersion
      EnableIAMDatabaseAuthentication: true
      Port: 5432
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecretArn}:SecretString:db_master_password}}'
      VpcSecurityGroupIds:
        - !Ref RDSSecurityGroupId
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: !Ref BackupRetentionDays
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'
      EnableCloudwatchLogsExports:
        - postgresql
      StorageEncrypted: true
      DeletionProtection: !Ref DeletionProtection
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-aurora-cluster'

  # Allow access from EKS cluster security group
  RDSSecurityGroupIngressFromCluster:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EKSClusterSecurityGroupId

  # Aurora DB Instance (required for Serverless v2)
  AuroraInstance1:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${DeploymentName}-db-1'
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-aurora-instance-1'

  # Aurora DB Instance 2 (for HA)
  AuroraInstance2:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${DeploymentName}-db-2'
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-aurora-instance-2'

Outputs:
  DBEndpoint:
    Description: Aurora Cluster Endpoint Address
    Value: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-DBEndpoint'

  DBPort:
    Description: Aurora Port
    Value: !GetAtt AuroraCluster.Endpoint.Port
    Export:
      Name: !Sub '${AWS::StackName}-DBPort'

  DBName:
    Description: Database Name
    Value: !Ref DBName
    Export:
      Name: !Sub '${AWS::StackName}-DBName'

  ClusterResourceId:
    Description: Aurora Cluster Resource ID
    Value: !GetAtt AuroraCluster.DBClusterResourceId
