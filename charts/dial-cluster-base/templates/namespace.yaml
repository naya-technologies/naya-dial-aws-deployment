apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "namespace is required" .Values.namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: dial
  annotations:
    # The namespace holds DIAL data volumes; never delete it because this release is uninstalled.
    helm.sh/resource-policy: keep
