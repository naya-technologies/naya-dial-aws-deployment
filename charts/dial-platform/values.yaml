adminRdsIam:
  caBundle:
    enabled: false
    configMapName: dial-admin-rds-ca
    key: aws-rds-bundle.crt
    file: files/aws-rds-global-bundle.pem

# Read by dial-install, not by any template: the images of the cluster add-ons that are installed next to the
# platform. Every value is a full image reference. This is the single place that pins their versions; the chart
# tag in the Marketplace is the release.
installer:
  # The registry every image reference in this chart points to by default (what the Marketplace validates).
  # dial-install replaces it with registry.source, or with the customer's own ECR when images are copied.
  registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam
  # Optional value sets. `profiles.rdsIam.values` is merged into the values when dial-install runs with
  # database.auth: iam (DIAL Admin signs in to the database with its IAM role instead of a password).
  profiles:
    rdsIam:
      values:
        adminRdsIam:
          caBundle:
            enabled: true
        admin:
          externalDatabase:
            user: 'PLACEHOLDER_ADMIN_DB_IAM_USER'
            password: ''
          backend:
            configuration:
              datasourceAuth:
                type: aws
                aws:
                  region: 'PLACEHOLDER_AWS_REGION'
            env:
              USE_SYSTEM_CA_CERTS: 'true'
            serviceAccount:
              create: true
              name: dial-admin-backend
              annotations:
                eks.amazonaws.com/role-arn: 'PLACEHOLDER_ADMIN_BACKEND_RDS_ROLE_ARN'
            extraVolumes:
              - name: aws-rds-ca
                configMap:
                  name: dial-admin-rds-ca
            extraVolumeMounts:
              - name: aws-rds-ca
                mountPath: /certificates/aws-rds-bundle.crt
                subPath: aws-rds-bundle.crt
                readOnly: true
  addons:
    clusterAutoscaler: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-cluster-autoscaler:2026.10.1
    istio:
      pilot: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-istio-pilot:2026.10.1
      proxy: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-istio-proxyv2:2026.10.1
    knative:
      serving-activator: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-knative-activator:2026.10.1
      serving-autoscaler: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-knative-autoscaler:2026.10.1
      serving-controller: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-knative-controller:2026.10.1
      serving-webhook: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-knative-webhook:2026.10.1
      serving-queue: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-knative-queue-proxy:2026.10.1
      net-istio-controller: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-net-istio-controller:2026.10.1
      net-istio-webhook: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-net-istio-webhook:2026.10.1

global:
  region: 'PLACEHOLDER_AWS_REGION'

albcontroller:
  enabled: true
  clusterName: 'PLACEHOLDER_EKS_CLUSTER_NAME'
  region: 'PLACEHOLDER_AWS_REGION'
  vpcId: 'PLACEHOLDER_VPC_ID'
  # Avoid install-time race where Ingress creation can be blocked by the validating webhook
  # before the controller's webhook service has endpoints.
  webhookConfig:
    disableIngressValidation: true
  image:
    repository: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-alb-controllers
    tag: '2026.10.1'
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: aws-load-balancer-controller
    annotations:
      eks.amazonaws.com/role-arn: 'PLACEHOLDER_ALB_CONTROLLER_ROLE_ARN'
  replicaCount: 2
  ingressClass: alb
  enableWaf: false
  enableWafv2: false
  enableShield: false
  nodeSelector:
    workload: core
dial:
  core:
    enabled: true
    image:
      registry: "709825985650.dkr.ecr.us-east-1.amazonaws.com"
      repository: naya-technologies-by-epam/naya-dial-core
      tag: '2026.10.1'
    serviceAccount:
      create: true
      name: dial-core
      annotations:
        eks.amazonaws.com/role-arn: 'PLACEHOLDER_CORE_SERVICE_ROLE_ARN'
    configuration:
      encryption:
        secret: 'PLACEHOLDER_CORE_ENCRYPTION_SECRET'
        key: 'PLACEHOLDER_CORE_ENCRYPTION_KEY'
    env:
      SPEC_STRING: "YjN4T3d6VVFKcFNicFEybzg2OUQ1OHVlT2dKVnpwcHNHWVJvc2h1ejREQT0="
      aidial.applications.includeCustomApps: 'true'
      aidial.applications.controllerTimeout: '600000'
      aidial.applications.controllerEndpoint: 'http://{{ .Release.Name }}-app-controller.{{ .Release.Namespace }}.svc.cluster.local:80'
      aidial.identityProviders.cognito.obfuscateUserEmail: "false"
      aidial.codeInterpreter.sessionImage: 709825985650.dkr.ecr.us-east-1.amazonaws.com/naya-technologies-by-epam/naya-dial-code-interpreter:2026.10.1
      aidial.config.files: '["/mnt/secrets-store/aidial.config.json"]'
      aidial.storage.provider: aws-s3
      aidial.managedSecrets.provider: aws
      aidial.managedSecrets.aws.region: 'PLACEHOLDER_AWS_REGION'
      aidial.storage.bucket: 'PLACEHOLDER_S3_BUCKET_NAME'
      aidial.storage.createBucket: 'false'
      aidial.storage.prefix: core
      aidial.redis.singleServerConfig.address: 'PLACEHOLDER_REDIS_ENDPOINT'
      aidial.redis.provider.name: aws-elasti-cache
      aidial.redis.provider.userId: 'PLACEHOLDER_REDIS_USER_ID'
      aidial.redis.provider.region: 'PLACEHOLDER_AWS_REGION'
      aidial.redis.provider.clusterName: 'PLACEHOLDER_REDIS_CLUSTER_NAME'
      aidial.redis.provider.serverless: 'true'
      aidial.identityProviders.cognito.jwksUrl: 'PLACEHOLDER_COGNITO_JWKS_URL'
      aidial.identityProviders.cognito.rolePath: cognito:groups
      aidial.identityProviders.cognito.issuerPattern: ^https:\/\/cognito-idp\.PLACEHOLDER_AWS_REGION\.amazonaws\.com.+$
      aidial.identityProviders.cognito.loggingKey: sub
    secrets:
      aidial.identityProviders.cognito.loggingSalt: 'PLACEHOLDER_COGNITO_LOGGING_SALT'
      aidial.config.json: 'PLACEHOLDER_CORE_CONFIG_JSON'
        
    # Enable Vector logger for realtime analytics
    logger:
      enabled: true
      image:
        registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
        repository: naya-technologies-by-epam/naya-dial-realtime-analytics-vector
        tag: '2026.10.1'
      extraVolumeMounts:
      - name: vector-data
        mountPath: /var/lib/vector
      config: |
        sources:
          aidial_logs:
            type: file
            max_line_bytes: 100000000
            oldest_first: true
            include:
              - /app/log/*.log
        sinks:
          http_analytics_opensource:
            inputs:
              - aidial_logs
            type: http
            uri: http://PLACEHOLDER_DIAL_RELEASE_NAME-realtime-analytics.dial.svc.cluster.local:80/data
            request:
              timeout_secs: 300
            batch:
              max_bytes: 1049000
              timeout_secs: 60
            encoding:
              codec: json

    resources:
      requests:
        cpu: "100m"
        memory: "700Mi"
      limits:
        memory: "2Gi"
    nodeSelector:
      workload: core
    extraVolumes:
    - name: config
      secret:
        secretName: '{{ template "dialCore.names.fullname" . }}'
        items:
        - key: aidial.config.json
          path: aidial.config.json
    - name: vector-data
      emptyDir: {}
    extraVolumeMounts:
    - name: config
      mountPath: /mnt/secrets-store
      readOnly: true
    redis:
      enabled: false
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: 'PLACEHOLDER_ALB_SCHEME'
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/healthcheck-path: /health
        alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
        alb.ingress.kubernetes.io/load-balancer-attributes: routing.http2.enabled=true,idle_timeout.timeout_seconds=300
        alb.ingress.kubernetes.io/listen-ports: '[{ "HTTP" : 80, "HTTPS" : 443 }]'
        alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-Ext-2018-06
        alb.ingress.kubernetes.io/certificate-arn: 'PLACEHOLDER_ACM_CERTIFICATE_ARN'
        alb.ingress.kubernetes.io/ssl-redirect: '443'
        alb.ingress.kubernetes.io/security-groups: 'PLACEHOLDER_ALB_SECURITY_GROUP_ID'
        alb.ingress.kubernetes.io/subnets: 'PLACEHOLDER_ALB_SUBNETS'
        alb.ingress.kubernetes.io/group.name: 'PLACEHOLDER_ALB_GROUP_NAME'
      hosts:
      - 'PLACEHOLDER_DIAL_PUBLIC_HOST'
  chat:
    enabled: true
    image:
      registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
      repository: naya-technologies-by-epam/naya-dial-ui
      tag: '2026.10.1'
    env:
      BFF_PORT: '3001'
      APP_DIAL_API_BASE: http://PLACEHOLDER_DIAL_RELEASE_NAME-core.dial.svc.cluster.local
      APP_DIAL_ADMIN_API_BASE: http://PLACEHOLDER_DIAL_RELEASE_NAME-admin-backend.dial.svc.cluster.local/
      APP_THEMES_HOST: 'https://PLACEHOLDER_THEMES_PUBLIC_HOST'
      APP_COGNITO_REGION: 'PLACEHOLDER_AWS_REGION'
      APP_COGNITO_USER_POOL_ID: 'PLACEHOLDER_COGNITO_USER_POOL_ID'
      APP_COGNITO_CLIENT_ID: 'PLACEHOLDER_COGNITO_CLIENT_ID'
      APP_COGNITO_DOMAIN: 'PLACEHOLDER_COGNITO_HOSTED_UI_URL'
      APP_COGNITO_REDIRECT_URI: 'https://PLACEHOLDER_CHAT_PUBLIC_HOST/api/auth/callback/cognito'
      APP_COGNITO_LOGOUT_URI: 'https://PLACEHOLDER_CHAT_PUBLIC_HOST'
      APP_COGNITO_SCOPE: openid email profile
      APP_ANALYTICS_ENABLED: 'PLACEHOLDER_ANALYTICS_ENABLED'
      APP_SUPERSET_API_BASE: 'http://dial-superset.{{ .Release.Namespace }}.svc.cluster.local'
      APP_SUPERSET_DOMAIN: 'https://PLACEHOLDER_SUPERSET_PUBLIC_HOST'
      APP_SUPERSET_AUTH_PROVIDER: db
      APP_SUPERSET_USERNAME: admin
      APP_SUPERSET_GUEST_USERNAME: dial-guest
      APP_SUPERSET_GUEST_FIRST_NAME: DIAL
      APP_SUPERSET_GUEST_LAST_NAME: Guest
      APP_SUPERSET_RLS: '[]'
      DASHBOARDS_PUBLIC_ROOT: public/superset/dashboards/
    secrets:
      COGNITO_CLIENT_SECRET: 'PLACEHOLDER_COGNITO_CLIENT_SECRET'
      APP_SUPERSET_PASSWORD: 'PLACEHOLDER_SUPERSET_ADMIN_PASSWORD'
      DASHBOARDS_CORE_API_KEY: 'PLACEHOLDER_CORE_ADMIN_API_KEY'
      DASHBOARDS_SIGNING_SECRET: 'PLACEHOLDER_DASHBOARDS_SIGNING_SECRET'
      SUPERSET_DASHBOARD_ARTIFACT_SIGNING_SECRET: 'PLACEHOLDER_SUPERSET_DASHBOARD_ARTIFACT_SIGNING_SECRET'
    nodeSelector:
      workload: core
    resources:
      requests:
        cpu: "100m"
        memory: "700Mi"
      limits:
        memory: "3Gi"
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: 'PLACEHOLDER_ALB_SCHEME'
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/healthcheck-path: /bff/health
        alb.ingress.kubernetes.io/success-codes: '200'
        alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
        alb.ingress.kubernetes.io/load-balancer-attributes: routing.http2.enabled=true,idle_timeout.timeout_seconds=300
        alb.ingress.kubernetes.io/listen-ports: '[{ "HTTP" : 80, "HTTPS" : 443 }]'
        alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-Ext-2018-06
        alb.ingress.kubernetes.io/certificate-arn: 'PLACEHOLDER_ACM_CERTIFICATE_ARN'
        alb.ingress.kubernetes.io/ssl-redirect: '443'
        alb.ingress.kubernetes.io/security-groups: 'PLACEHOLDER_ALB_SECURITY_GROUP_ID'
        alb.ingress.kubernetes.io/subnets: 'PLACEHOLDER_ALB_SUBNETS'
        alb.ingress.kubernetes.io/group.name: 'PLACEHOLDER_ALB_GROUP_NAME'
      hosts:
      - 'PLACEHOLDER_CHAT_PUBLIC_HOST'
    containerPorts:
      http: 3001
    livenessProbe:
      enabled: true
      httpGet:
        path: /bff/health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 6
    readinessProbe:
      enabled: true
      httpGet:
        path: /bff/health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 6
  themes:
    enabled: true
    image:
      registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
      repository: naya-technologies-by-epam/naya-dial-themes
      tag: '2026.10.1'
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: 'PLACEHOLDER_ALB_SCHEME'
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/healthcheck-path: /health
        alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
        alb.ingress.kubernetes.io/load-balancer-attributes: routing.http2.enabled=true
        alb.ingress.kubernetes.io/listen-ports: '[{ "HTTP" : 80, "HTTPS" : 443 }]'
        alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-Ext-2018-06
        alb.ingress.kubernetes.io/certificate-arn: 'PLACEHOLDER_ACM_CERTIFICATE_ARN'
        alb.ingress.kubernetes.io/ssl-redirect: '443'
        alb.ingress.kubernetes.io/security-groups: 'PLACEHOLDER_ALB_SECURITY_GROUP_ID'
        alb.ingress.kubernetes.io/subnets: 'PLACEHOLDER_ALB_SUBNETS'
        alb.ingress.kubernetes.io/group.name: 'PLACEHOLDER_ALB_GROUP_NAME'
      hosts:
      - 'PLACEHOLDER_THEMES_PUBLIC_HOST'
    resources:
      requests:
        cpu: "50m"
        memory: "100Mi"
      limits:
        memory: "300Mi"
    nodeSelector:
      workload: core
    extraVolumes:
    - name: customer-assets
      configMap:
        name: '{{ .Release.Name }}-themes-customer-assets'
        optional: true
    extraVolumeMounts:
    - name: customer-assets
      mountPath: /var/www/customer-assets
      readOnly: true
  bedrock:
    enabled: true
    image:
      registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
      repository: naya-technologies-by-epam/naya-dial-bedrock
      tag: '2026.10.1'
    env:
      DIAL_URL: http://PLACEHOLDER_DIAL_RELEASE_NAME-core.dial.svc.cluster.local
    resources:
      requests:
        cpu: "100m"
        memory: "300Mi"
      limits:
        memory: "1Gi"
    nodeSelector:
      workload: core
    serviceAccount:
      create: true
      name: dial-bedrock
      annotations:
        eks.amazonaws.com/role-arn: 'PLACEHOLDER_BEDROCK_SERVICE_ROLE_ARN'
  vertexai:
    enabled: false
  openai:
    enabled: false
admin:
