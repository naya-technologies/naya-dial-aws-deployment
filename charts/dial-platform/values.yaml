    workload: core
  env:
    REDIS_HOST: 'PLACEHOLDER_REDIS_HOSTNAME'

# Grafana (Analytics dashboards) - deployed in the same namespace as DIAL
grafana:
  fullnameOverride: grafana

  # Used by Grafana datasource provisioning via tpl rendering (see datasources.yaml below).
  # post-deploy.sh should override this with the actual InfluxDB token.
  analyticsToken: 'PLACEHOLDER_INFLUXDB_TOKEN'

  image:
    registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
    repository: naya-technologies-by-epam/naya-dial-grafana
    tag: '2026.10.1'
  initChownData:
    enabled: true
    image:
      registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
      repository: naya-technologies-by-epam/naya-dial-busybox
      tag: '2026.10.1'
  testFramework:
    enabled: false
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "1Gi"
  nodeSelector:
    workload: core

  replicas: 1

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: auto-ebs-gp3

  adminUser: admin
  adminPassword: 'PLACEHOLDER_GRAFANA_ADMIN_PASSWORD'

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: 'PLACEHOLDER_ALB_SCHEME'
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      alb.ingress.kubernetes.io/success-codes: '200'
      alb.ingress.kubernetes.io/listen-ports: '[{ "HTTP" : 80, "HTTPS" : 443 }]'
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-Ext-2018-06
      alb.ingress.kubernetes.io/certificate-arn: 'PLACEHOLDER_ACM_CERTIFICATE_ARN'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/security-groups: 'PLACEHOLDER_ALB_SECURITY_GROUP_ID'
      alb.ingress.kubernetes.io/subnets: 'PLACEHOLDER_ALB_SUBNETS'
      alb.ingress.kubernetes.io/group.name: 'PLACEHOLDER_ALB_GROUP_NAME'
    hosts:
      - 'PLACEHOLDER_GRAFANA_PUBLIC_HOST'

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: InfluxDB
          type: influxdb
          access: proxy
          url: "http://{{ .Release.Name }}-influxdb.{{ .Release.Namespace }}.svc.cluster.local:8086"
          isDefault: true
          jsonData:
            organization: dial
            defaultBucket: dial-analytics
            version: Flux
          secureJsonData:
            token: '{{ .Values.analyticsToken }}'

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: dial
          orgId: 1
          folder: Dial
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/dial

  # Dashboard JSON is packaged in the umbrella chart as ConfigMap `grafana-dashboards-dial`
  # from `dashboards/dial_analytics.json` (no external URL dependency).
  dashboardsConfigMaps:
    dial: grafana-dashboards-dial

  # Optional: if you add dashboards that use non-built-in panel plugins,
  # declare them here so Grafana installs them at startup.
  # plugins:
  #   - ae3e-plotly-panel
  #   - magnesium-wordcloud-panel
