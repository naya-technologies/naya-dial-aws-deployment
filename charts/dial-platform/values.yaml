superset:
  enabled: true
  fullnameOverride: dial-superset
  replicaCount: 1
  image:
    registry: 709825985650.dkr.ecr.us-east-1.amazonaws.com
    repository: naya-technologies-by-epam/naya-dial-superset
    tag: '2026.10.1'
    pullPolicy: IfNotPresent
  command:
    - /bin/bash
    - -c
  args:
    - |-
      set -euo pipefail
      if [ -n "${SUPERSET_METADATA_SCHEMA:-}" ]; then
        python - <<'PY'
      import os
      import re
      from sqlalchemy import create_engine, text
      from sqlalchemy.engine import make_url

      schema = os.environ["SUPERSET_METADATA_SCHEMA"]
      if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", schema):
          raise SystemExit("Invalid analytics metadata schema name")
      url = make_url(os.environ["SUPERSET_METADATA_DATABASE_URI"])
      query = dict(url.query)
      query.pop("options", None)
      with create_engine(url.set(query=query)).begin() as connection:
          connection.execute(text(f'CREATE SCHEMA IF NOT EXISTS "{schema}"'))
      PY
      fi
      echo "[bootstrap] upgrading analytics metadata"
      superset db upgrade
      echo "[bootstrap] ensuring analytics administrator"
      superset fab create-admin \
        --username "$ADMIN_USERNAME" \
        --firstname "$ADMIN_FIRSTNAME" \
        --lastname "$ADMIN_LASTNAME" \
        --email "$ADMIN_EMAIL" \
        --password "$ADMIN_PASSWORD" || true
      superset init
      exec gunicorn \
        --workers 4 \
        --worker-class gthread \
        --threads 20 \
        --timeout 60 \
        --keep-alive 25 \
        --bind 0.0.0.0:8088 \
        --limit-request-line 0 \
        --limit-request-field_size 0 \
        "superset.app:create_app()"
  containerPorts:
    http: 8088
  env:
    ADMIN_EMAIL: admin@example.com
    ADMIN_FIRSTNAME: Analytics
    ADMIN_LASTNAME: Admin
    ADMIN_USERNAME: admin
    ENABLE_PROXY_FIX: "true"
    PYTHONPATH: /app/pythonpath
    SUPERSET_ANALYTICS_API_ENABLED: "1"
    SUPERSET_LOAD_EXAMPLES: "no"
    TALISMAN_ENABLED: "false"
  secrets:
    ADMIN_PASSWORD: PLACEHOLDER_SUPERSET_ADMIN_PASSWORD
    SUPERSET_SECRET_KEY: PLACEHOLDER_SUPERSET_SECRET_KEY
    SUPERSET_DASHBOARD_ARTIFACT_SIGNING_SECRET: PLACEHOLDER_SUPERSET_DASHBOARD_ARTIFACT_SIGNING_SECRET
    SUPERSET_METADATA_DATABASE_URI: PLACEHOLDER_SUPERSET_METADATA_DATABASE_URI
    SUPERSET_METADATA_SCHEMA: superset
    SUPERSET_CACHE_REDIS_URL: PLACEHOLDER_SUPERSET_CACHE_REDIS_URL
    SUPERSET_CACHE_REDIS_CLUSTER_MODE: "true"
  publicBaseUrl: https://PLACEHOLDER_SUPERSET_PUBLIC_HOST
  embedAllowedDomains: https://PLACEHOLDER_CHAT_PUBLIC_HOST
  extraVolumeMounts:
    - name: superset-home
      mountPath: /app/superset_home
