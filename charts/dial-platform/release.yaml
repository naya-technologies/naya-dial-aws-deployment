# One DIAL release: everything the installer needs to know that is not an image.
# Image versions (platform, build tools and cluster add-ons) are pinned in the platform chart tagged with this release
# id in the Marketplace; the installer reads them from there.
apiVersion: dial-release/v1
release: 2026.10.4

min_installer_version: 2.0.0     # older installers refuse this release
infra_revision: 3                # bump when a CloudFormation template changes; upgrade then requires --with-infra
notes: |
  Adds Flow Builder to the platform: the backend (flows-core) and the editor (flows), two new host names, the application type
  "Flow Builder" in DIAL Core, and the "Agent Builder" name for QuickApps. The sign-in callbacks of the Cognito app client change,
  so an upgrade needs --with-infra, and the secret needs the new key flows_session_secret (dial-install init creates it).
  Also: chat works in the UI (managed chat application), the default model is hidden, RAG is not part of the platform.
  dial-core and dial-lic-ins are 2026.10.2; all other components 2026.10.1.

chart:
  version: 2026.10.4

kubernetes:
  default_version: "1.35"

database:
  engine_version: "15.13"                   # Aurora PostgreSQL; `check` verifies AWS still offers it for new clusters

# Versions of the add-on software the installer downloads or runs. Their images are in the chart (installer.addons).
addons:
  cluster_autoscaler:
    chart_version: 9.59.0                   # Helm chart of the autoscaler
    kubernetes: "1.35"                       # Kubernetes minor the autoscaler image in the chart is built for
  istio:
    version: 1.29.1                         # version of the pre-rendered Istio manifest (assets/istio)
  knative:
    version: knative-v1.21.0                # upstream release the manifests are downloaded from
  rds_iam_bootstrap_image:                  # only for database.auth: iam; a repository of the product registry
    repository: naya-dial-postgres
    tag: 15-alpine
